# Render Blueprint (checked against render.com/docs/blueprint-spec on 2026-11-13).
# Serves Group 3's real NASA data from data/processed/ (built by scripts/build_real_data.py).
# APP_ENV stays dev on this staging service; the app refuses prod + mock by design.
services:
  - type: web
    name: trendtrace-api-staging
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt -c requirements.lock
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: dev
      - key: DATA_MODE
        value: real
      - key: MOCK_SCENARIO
        value: normal
      - key: LOG_LEVEL
        value: INFO
      - key: REPORTS_DIR
        value: reports
      - key: MAX_BODY_BYTES
        value: "65536"
      - key: ALLOWED_ORIGIN
        sync: false
      # AI explanations: Groq free tier (OpenAI-compatible). The key itself is set only in the Render dashboard.
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
